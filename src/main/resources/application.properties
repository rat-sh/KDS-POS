spring.application.name=kds
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kitchenflow}
spring.datasource.username=${DATABASE_USERNAME:kitchenflow}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:12}
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

kitchenflow.jwt-secret=${KITCHENFLOW_JWT_SECRET:}
kitchenflow.access-token-seconds=${ACCESS_TOKEN_SECONDS:900}
kitchenflow.refresh-token-days=${REFRESH_TOKEN_DAYS:14}
kitchenflow.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
kitchenflow.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
kitchenflow.bootstrap-admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
kitchenflow.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
kitchenflow.bootstrap-admin-display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME:Outlet Administrator}
