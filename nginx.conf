limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_requests:10m rate=1r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"timestamp":"$time_iso8601","status":429,"code":"RATE_LIMITED","message":"Request rate limit reached.","path":"$uri","correlationId":"$request_id","details":{"rateClass":"EDGE","retryAfterSeconds":60},"errors":[]}';
    }

    location = /api/v1/auth/login {
        limit_req zone=login_requests burst=4 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
    }

    location /api/ {
        limit_req zone=api_requests burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /actuator/health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
