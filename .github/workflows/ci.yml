name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile & verify backend
        run: ./mvnw -B -DskipTests compile

  frontend:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./KitchenFlow_Operations_Screens
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Run ESLint
        run: bun run lint

      - name: Run unit & domain tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

